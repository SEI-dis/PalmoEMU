# SPDX-License-Identifier: AGPL-3.0-or-later
name: Publish PalmoEMU

# Run manually to publish the static Web application.
on:
  workflow_dispatch:
    inputs:
      validation_run:
        description: 'Exact successful core-candidate CI run (automatic updates only)'
        type: string
        required: false

permissions:
  contents: read
  actions: read
  pages: read

concurrency:
  group: local-play-pages
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          lfs: false
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - name: Require successful validation of this commit
        env:
          GH_TOKEN: ${{ github.token }}
          CORE_VALIDATION_RUN: ${{ inputs.validation_run }}
        run: |
          node --input-type=module <<'NODE'
          const {GITHUB_REPOSITORY, GITHUB_SHA, GH_TOKEN, CORE_VALIDATION_RUN} = process.env;
          if (CORE_VALIDATION_RUN && !/^\d+$/.test(CORE_VALIDATION_RUN)) throw Error('Invalid validation run');
          const headers = {
            Accept: 'application/vnd.github+json',
            Authorization: `Bearer ${GH_TOKEN}`,
            'X-GitHub-Api-Version': '2022-11-28'
          };
          const get = async route => {
            const response = await fetch(`https://api.github.com/repos/${GITHUB_REPOSITORY}/${route}`, {headers, signal: AbortSignal.timeout(30000)});
            if (!response.ok) throw Error(`Cannot verify CI: HTTP ${response.status}`);
            return response.json();
          };
          let run;
          if (CORE_VALIDATION_RUN) {
            for (let attempt = 0; attempt < 24; attempt++) {
              run = await get(`actions/runs/${CORE_VALIDATION_RUN}`);
              if (run.status === 'completed') break;
              await new Promise(resolve => setTimeout(resolve, 5000));
            }
            const workflow = await get('actions/workflows/ci.yml');
            const commit = await get(`commits/${GITHUB_SHA}`);
            if (run.workflow_id !== workflow.id || run.head_sha !== GITHUB_SHA || run.event !== 'workflow_dispatch' ||
                !/^codex\/core-update-[a-f0-9]{12}-\d+$/.test(run.head_branch) ||
                !/^Update mGBA core to [a-f0-9]{40} \[core-auto\]$/.test(commit.commit.message) ||
                commit.commit.author.email !== '41898282+github-actions[bot]@users.noreply.github.com') throw Error('Invalid automatic core validation');
          } else {
            const data = await get(`actions/workflows/ci.yml/runs?head_sha=${GITHUB_SHA}&event=push&per_page=5`);
            run = data.workflow_runs?.find(item => item.head_sha === GITHUB_SHA && item.head_branch === 'main' && item.event === 'push');
          }
          if ((await get('git/ref/heads/main')).object.sha !== GITHUB_SHA) throw Error('Main changed; do not deploy a stale build');
          if (run?.status !== 'completed' || run.conclusion !== 'success') {
            throw new Error(`Wait for Validate Web release to succeed for ${GITHUB_SHA}, then run publication again. ${run?.html_url || ''}`);
          }
          console.log(`Validated commit: ${GITHUB_SHA} (${run.html_url})`);
          NODE
      - run: node web/tests/core.cjs
      - run: node web/tests/core-container.cjs
      - run: node web/tests/nds-core.cjs
      - run: python3 -B web/tests/audit-content.py
      # Generate only the source ZIP from this checkout. Never regenerate the
      # reviewed inventory, approval records, translations or offline manifest.
      - run: python3 -B web/scripts/prepare-release.py
      - run: node work/release/web/scripts/check-release.cjs
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: work/release/web
  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Refuse a stale deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)" = "$GITHUB_SHA"
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
