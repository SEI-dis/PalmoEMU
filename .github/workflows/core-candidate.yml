name: Check upstream core update
on:
  workflow_call:
    inputs:
      commit:
        type: string
        required: true
      adopt:
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      commit:
        description: 'Optional exact rom64 commit (empty: current branch head)'
        required: false
        type: string
      adopt:
        description: 'After policy/build checks, validate on a candidate branch and adopt automatically'
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: core-candidate
  cancel-in-progress: false
jobs:
  candidate:
    runs-on: windows-latest
    timeout-minutes: 35
    outputs:
      commit: ${{ steps.build.outputs.candidate_commit }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - name: Install pinned build tools
        run: |
          python -m pip install cmake==3.31.6 ninja==1.11.1.4
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          git init work/emsdk
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          git -C work/emsdk fetch --depth=1 https://github.com/emscripten-core/emsdk.git b44154299bdefe75ba287874bb63fc9806243771
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          git -C work/emsdk checkout --detach FETCH_HEAD
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python work/emsdk/emsdk.py install 4.0.15
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python work/emsdk/emsdk.py activate 4.0.15
      - name: Build and check a separate candidate
        id: build
        env:
          CANDIDATE_COMMIT: ${{ inputs.commit }}
          ADOPT: ${{ inputs.adopt }}
        run: |
          $candidateArgs = @('-B', '-X', 'utf8', 'web/scripts/core-candidate.py', '--emsdk', 'work/emsdk')
          if ($env:CANDIDATE_COMMIT) { $candidateArgs += @('--commit', $env:CANDIDATE_COMMIT) }
          if ($env:ADOPT -eq 'true') { $candidateArgs += '--adopt' }
          python @candidateArgs
      # Only policy-verified sources/binaries are uploaded. New dependencies,
      # rights/build changes and patch conflicts stop before this step.
      - name: Keep verified candidate for isolated promotion
        if: inputs.adopt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: core-update-candidate
          path: work/core-candidates/update.zip
          if-no-files-found: error
          retention-days: 7
      - name: Keep the review report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: core-update-review
          path: work/core-candidates/latest-report.json
          if-no-files-found: ignore
          retention-days: 14
  candidate-branch:
    needs: candidate
    if: inputs.adopt && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: core-update-candidate
          path: work/core-update-artifact
      - name: Apply only the verified core update files
        env:
          BASE: ${{ github.sha }}
          UPSTREAM: ${{ needs.candidate.outputs.commit }}
        run: python3 -B web/scripts/core-update.py apply work/core-update-artifact/update.zip --base "$BASE" --upstream "$UPSTREAM"
      - name: Push isolated candidate and explicitly start validation
        env:
          GH_TOKEN: ${{ github.token }}
        run: node web/scripts/core-auto.mjs candidate
