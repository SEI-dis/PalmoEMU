# SPDX-License-Identifier: AGPL-3.0-or-later
name: Validate Web release
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      core_update:
        description: 'Promote an automated core candidate only after every validation job passes'
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true
jobs:
  release-portability:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - run: python3 -B web/tests/audit-content.py
      - run: python3 -B web/scripts/prepare-release.py
      - run: node work/release/web/scripts/check-release.cjs
  validate:
    name: ${{ matrix.engine }} (${{ matrix.shard }}/5)
    runs-on: windows-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, webkit]
        shard: [1, 2, 3, 4, 5]
    env:
      BROWSER_CHANNEL: msedge
      BROWSER_ENGINE: ${{ matrix.engine }}
      PLAYWRIGHT_MODULE: ${{ github.workspace }}/work/test-deps/node_modules/playwright
      CELIO_SERVER_ROOT: ${{ github.workspace }}/work/celio-server
      CELIO_REFERENCE_ROOT: ${{ github.workspace }}/work/celio-reference
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - name: Audit repository and reviewed distribution
        run: |
          python -B -X utf8 web/scripts/audit-git.py
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python -B -X utf8 web/scripts/prepare-release.py
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          node work/release/web/scripts/check-release.cjs
      - name: Prepare isolated browser and local relay fixtures
        run: |
          npm install --prefix work/test-deps --no-audit --no-fund --ignore-scripts playwright@1.62.1
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          if ($env:BROWSER_ENGINE -eq 'webkit') {
            node work/test-deps/node_modules/playwright/cli.js install webkit
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
          }
          $selection = node web/scripts/test-all.cjs --list --shard=${{ matrix.shard }}/5
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          if ($env:BROWSER_ENGINE -eq 'chromium' -and ($selection | ConvertFrom-Json).tests.name -contains 'test:recording') {
            # Windows Server needs Media Foundation for real AAC encoding.
            # A preinstalled Edge and isTypeSupported alone are insufficient.
            node work/test-deps/node_modules/playwright/cli.js install-deps chromium
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
          }
          if (($selection | ConvertFrom-Json).tests.name -contains 'test:room-link') {
            python -B -X utf8 web/scripts/prepare-link-tests.py
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
          }
      - name: Run all suites assigned to this shard
        run: node web/scripts/test-all.cjs --serve --shard=${{ matrix.shard }}/5
      - name: Keep synthetic test diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: test-results-${{ matrix.engine }}-${{ matrix.shard }}
          path: web/test-results/
          retention-days: 7
  promote-core:
    needs: [release-portability, validate]
    if: github.event_name == 'workflow_dispatch' && inputs.core_update && startsWith(github.ref_name, 'codex/core-update-')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      # Run the promotion script from trusted main, never from the candidate.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - name: Adopt the exact tested commit and publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: node web/scripts/core-auto.mjs promote
