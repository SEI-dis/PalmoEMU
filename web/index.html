<template id="latest-update-notes" data-version="0.3.24">
<p class="update-note-version" translate="no">0.3.24</p>
<ul><li data-i18n="{&quot;en&quot;:&quot;Copy in-game saves to an updated ROM while keeping the old ROM and its saves.&quot;,&quot;zh-Hans&quot;:&quot;现在可以将游戏内存档复制到新版ROM，同时保留旧ROM和存档。&quot;,&quot;zh-Hant&quot;:&quot;現已支援將遊戲內存檔複製至新版 ROM，同時保留舊 ROM 和存檔。&quot;,&quot;ko&quot;:&quot;기존 ROM과 세이브를 유지한 채 신규 버전 ROM으로 게임 내 세이브를 이월할 수 있게 되었습니다.&quot;,&quot;es&quot;:&quot;Ahora puedes copiar la partida guardada a una nueva versión de la ROM y conservar la ROM anterior y sus partidas.&quot;,&quot;fr&quot;:&quot;Copiez la sauvegarde du jeu vers une nouvelle version de la ROM tout en conservant l’ancienne ROM et ses sauvegardes.&quot;,&quot;de&quot;:&quot;Spielstände lassen sich in eine neue ROM-Version kopieren. Die alte ROM und ihre Spielstände bleiben erhalten.&quot;,&quot;pt&quot;:&quot;Copie os saves do jogo para uma nova versão da ROM, mantendo a ROM antiga e seus saves.&quot;}">旧ROMとセーブを残したまま、新版ROMへゲーム内セーブを引き継げるようになりました。</li><li data-i18n="{&quot;en&quot;:&quot;Adjust D-pad sensitivity and touch areas, and test controls without a ROM.&quot;,&quot;zh-Hans&quot;:&quot;现在可以调整十字键的响应和触摸范围，并在不加载ROM的情况下测试按键。&quot;,&quot;zh-Hant&quot;:&quot;現在可以調整十字鍵的反應和觸控範圍，並在不載入ROM的情況下測試按鈕。&quot;,&quot;ko&quot;:&quot;십자키의 반응과 터치 범위를 조정하고, ROM 없이 버튼 조작을 테스트할 수 있습니다.&quot;,&quot;es&quot;:&quot;Puedes ajustar la sensibilidad de la cruceta y las áreas táctiles, y probar los controles sin una ROM.&quot;,&quot;fr&quot;:&quot;Réglez la sensibilité de la croix directionnelle et les zones tactiles, et testez les commandes sans ROM.&quot;,&quot;de&quot;:&quot;Empfindlichkeit des Steuerkreuzes und Touchbereiche lassen sich anpassen. Die Steuerung kann ohne ROM getestet werden.&quot;,&quot;pt&quot;:&quot;Ajuste a sensibilidade do direcional e as áreas de toque e teste os controles sem uma ROM.&quot;}">十字キーの反応やタッチ範囲を調整し、ROMなしでボタン操作を試せるようになりました。</li><li data-i18n="{&quot;en&quot;:&quot;Added GB/GBC link play on one device and DS lid controls.&quot;,&quot;zh-Hans&quot;:&quot;新增GB/GBC同一设备内的联机功能，以及DS合盖和开盖操作。&quot;,&quot;zh-Hant&quot;:&quot;新增GB/GBC在同一裝置內的連線功能，以及DS闔蓋和開蓋操作。&quot;,&quot;ko&quot;:&quot;같은 기기 안에서 GB/GBC 두 대를 연결하는 기능과 DS 덮개 열기/닫기 조작을 추가했습니다.&quot;,&quot;es&quot;:&quot;Se han añadido la conexión GB/GBC en un mismo dispositivo y los controles de la tapa de DS.&quot;,&quot;fr&quot;:&quot;Ajout de la liaison GB/GBC sur un même appareil et des commandes du couvercle de la DS.&quot;,&quot;de&quot;:&quot;Link-Verbindungen für GB/GBC auf demselben Gerät und das Öffnen und Schließen des DS-Deckels wurden hinzugefügt.&quot;,&quot;pt&quot;:&quot;Adicionamos conexão GB/GBC no mesmo dispositivo e controles para abrir e fechar a tampa do DS.&quot;}">GB・GBCの端末内通信と、DSのふたを閉じる・開く操作を追加しました。</li></ul>
<p><a id="release-notice-details" href="notices.html#v0-3-24">詳しく見る</a></p>
</template>
