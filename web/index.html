<template id="latest-update-notes" data-version="0.3.26">
<p class="update-note-version" translate="no">0.3.26</p>
<ul><li data-i18n="{&quot;en&quot;:&quot;The camera button now records video with game audio. Screenshots can also be previewed, saved and shared.&quot;,&quot;zh-Hans&quot;:&quot;现在可以通过相机按钮录制含游戏音频的视频。截图也可以预览、保存和分享。&quot;,&quot;zh-Hant&quot;:&quot;現在可透過相機按鈕錄製含遊戲音訊的影片。截圖也可以預覽、儲存和分享。&quot;,&quot;ko&quot;:&quot;카메라 버튼으로 게임 소리가 포함된 동영상을 녹화할 수 있습니다. 스크린샷도 미리 본 후 저장하거나 공유할 수 있습니다.&quot;,&quot;es&quot;:&quot;El botón de cámara permite grabar vídeo con el audio del juego. Las capturas también se pueden previsualizar, guardar y compartir.&quot;,&quot;fr&quot;:&quot;Le bouton appareil photo permet désormais de filmer avec le son du jeu. Les captures peuvent aussi être prévisualisées, enregistrées et partagées.&quot;,&quot;de&quot;:&quot;Über die Kamerataste lassen sich jetzt Videos mit Spielton aufnehmen. Screenshots können in der Vorschau angesehen, gespeichert und geteilt werden.&quot;,&quot;pt&quot;:&quot;O botão da câmera agora grava vídeos com o áudio do jogo. As capturas de tela também podem ser visualizadas, salvas e compartilhadas.&quot;}">カメラボタンからゲーム音付きの動画を録画できるようになりました。スクリーンショットもプレビューから保存・共有できます。</li><li data-i18n="{&quot;en&quot;:&quot;When updating PokemonStart to 0.42.3, the app checks the source version and save to explain whether conversion is needed. Conversion and transfer can be completed within the app.&quot;,&quot;zh-Hans&quot;:&quot;将PokemonStart更新至0.42.3时，应用会检查原版本和存档，说明是否需要转换。转换和存档迁移可在应用内完成。&quot;,&quot;zh-Hant&quot;:&quot;將PokemonStart更新至0.42.3時，應用程式會檢查原版本與存檔，說明是否需要轉換。轉換與存檔移轉可在應用程式內完成。&quot;,&quot;ko&quot;:&quot;PokemonStart를 0.42.3으로 업데이트할 때 기존 버전과 세이브를 확인해 변환 필요 여부를 안내합니다. 변환부터 세이브 이전까지 앱 안에서 진행할 수 있습니다.&quot;,&quot;es&quot;:&quot;Al actualizar PokemonStart a 0.42.3, la aplicación comprueba la versión de origen y la partida para indicar si hace falta convertirla. La conversión y la transferencia se realizan dentro de la aplicación.&quot;,&quot;fr&quot;:&quot;Lors de la mise à jour de PokemonStart vers 0.42.3, la version d’origine et la sauvegarde sont vérifiées pour indiquer si une conversion est nécessaire. La conversion et le transfert se font dans l’application.&quot;,&quot;de&quot;:&quot;Beim Update von PokemonStart auf 0.42.3 prüft die App Ausgangsversion und Spielstand und zeigt an, ob eine Konvertierung nötig ist. Konvertierung und Übertragung erfolgen direkt in der App.&quot;,&quot;pt&quot;:&quot;Ao atualizar PokemonStart para 0.42.3, o aplicativo verifica a versão de origem e o save para informar se é necessária uma conversão. A conversão e a transferência são feitas dentro do aplicativo.&quot;}">PokemonStartの0.42.3への更新で、元の版とセーブを調べて変換の要否を案内します。必要な変換から引き継ぎまで、アプリ内で進められます。</li><li data-i18n="{&quot;en&quot;:&quot;Adjusted battery-save and automatic-state intervals to about two minutes, avoiding duplicate saves and repeated retries after failures. Battery saves take priority when storage is full.&quot;,&quot;zh-Hans&quot;:&quot;游戏存档和自动即时存档的保存间隔调整为约2分钟，减少重复保存和失败后的连续重试。存储空间不足时优先保存游戏存档。&quot;,&quot;zh-Hant&quot;:&quot;遊戲存檔與自動即時存檔的儲存間隔調整為約2分鐘，減少重複儲存及失敗後的連續重試。儲存空間不足時優先儲存遊戲存檔。&quot;,&quot;ko&quot;:&quot;게임 세이브와 자동 상태 저장 간격을 약 2분으로 조정하고, 중복 저장과 실패 후 연속 재시도를 줄였습니다. 저장 공간이 부족하면 게임 세이브 저장을 우선합니다.&quot;,&quot;es&quot;:&quot;Los intervalos de guardado de partida y de estado automático pasan a unos dos minutos. Se reducen los guardados duplicados y los reintentos continuos tras fallos. Si falta espacio, se prioriza la partida.&quot;,&quot;fr&quot;:&quot;Les sauvegardes de partie et d’état automatiques sont espacées d’environ deux minutes. Les opérations en double et les tentatives répétées après échec sont limitées. En cas de manque d’espace, la sauvegarde de partie est prioritaire.&quot;,&quot;de&quot;:&quot;Spielstände und automatische Speicherzustände werden etwa alle zwei Minuten gespeichert. Doppelte Vorgänge und ständige Wiederholungen nach Fehlern werden vermieden. Bei Platzmangel hat der Spielstand Vorrang.&quot;,&quot;pt&quot;:&quot;Os intervalos de gravação do save e do estado automático passaram a cerca de dois minutos. Foram reduzidas operações duplicadas e tentativas contínuas após falhas. Quando falta espaço, o save do jogo tem prioridade.&quot;}">通常セーブと自動ステートの保存間隔を約2分に調整し、保存中の重複処理や失敗時の連続再試行を抑えました。容量不足時は通常セーブの保存を優先します。</li></ul>
<p><a id="release-notice-details" href="notices.html#v0-3-26">詳しく見る</a></p>
</template>
