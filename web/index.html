<template id="latest-update-notes" data-version="0.3.43">
<p class="update-note-version" translate="no">0.3.43</p>
<ul><li data-i18n="{&quot;en&quot;:&quot;Action icons now have a consistent look. The PokemonStart “Update available” notice appears below the game title.&quot;,&quot;zh-Hans&quot;:&quot;统一了操作图标的样式。PokemonStart 有新版时，游戏名称下方会显示“有更新”。&quot;,&quot;zh-Hant&quot;:&quot;操作圖示的樣式已統一。PokemonStart 有新版本時，遊戲名稱下方會顯示「有更新」。&quot;,&quot;ko&quot;:&quot;조작 아이콘의 모양을 통일했습니다. PokemonStart 업데이트가 있으면 게임 이름 아래에 ‘업데이트 있음’이 표시됩니다.&quot;,&quot;es&quot;:&quot;Los iconos de acción tienen un estilo uniforme. El aviso «Actualización disponible» de PokemonStart aparece bajo el nombre del juego.&quot;,&quot;fr&quot;:&quot;Les icônes d’action ont été harmonisées. Pour PokemonStart, « Mise à jour disponible » s’affiche sous le nom du jeu.&quot;,&quot;de&quot;:&quot;Die Aktionssymbole sind jetzt einheitlich. Bei PokemonStart steht „Update verfügbar“ nun unter dem Spielnamen.&quot;,&quot;pt&quot;:&quot;Os ícones de ação agora seguem o mesmo estilo. O aviso “Atualização disponível” do PokemonStart aparece abaixo do nome do jogo.&quot;}">操作アイコンを統一し、PokemonStartの「更新あり」をゲーム名の下に表示するようにしました。</li><li data-i18n="{&quot;en&quot;:&quot;Move and zoom your Trainer Card image to choose the crop.&quot;,&quot;zh-Hans&quot;:&quot;移动或缩放训练家卡上的图片，即可选择裁剪范围。&quot;,&quot;zh-Hant&quot;:&quot;移動或縮放訓練家卡上的圖片，即可選擇裁切範圍。&quot;,&quot;ko&quot;:&quot;트레이너 카드 이미지를 옮기거나 확대해 원하는 부분만 남길 수 있습니다.&quot;,&quot;es&quot;:&quot;Mueve y amplía la imagen de tu Tarjeta de entrenador para elegir el recorte.&quot;,&quot;fr&quot;:&quot;Déplacez et agrandissez l’image de votre Carte de Dresseur pour choisir le cadrage.&quot;,&quot;de&quot;:&quot;Verschiebe oder vergrößere das Bild deiner Trainerkarte, um den gewünschten Ausschnitt zu wählen.&quot;,&quot;pt&quot;:&quot;Mova e amplie a imagem do seu Cartão de Treinador para escolher o recorte.&quot;}">トレーナーカードの画像を動かしたり拡大したりして、好きな位置で切り抜けます。</li><li data-i18n="{&quot;en&quot;:&quot;Reorder game menu items by dragging them or using the up and down buttons.&quot;,&quot;zh-Hans&quot;:&quot;拖动游戏菜单项即可调整顺序，也可以使用上移和下移按钮。&quot;,&quot;zh-Hant&quot;:&quot;拖曳遊戲選單項目即可調整順序，也可以使用上移和下移按鈕。&quot;,&quot;ko&quot;:&quot;게임 메뉴 항목을 드래그하거나 위아래 화살표 버튼을 눌러 순서를 바꿀 수 있습니다.&quot;,&quot;es&quot;:&quot;Reordena las opciones del menú del juego arrastrándolas o usando los botones de subir y bajar.&quot;,&quot;fr&quot;:&quot;Réorganisez le menu de jeu en faisant glisser les éléments ou en utilisant les boutons ↑ et ↓.&quot;,&quot;de&quot;:&quot;Sortiere die Einträge im Spielmenü durch Ziehen oder mit den Schaltflächen ↑ und ↓.&quot;,&quot;pt&quot;:&quot;Reordene os itens do menu do jogo arrastando-os ou usando os botões de subir e descer.&quot;}">ゲームメニューの項目をドラッグで並べ替えられます。上下ボタンも使えます。</li></ul>
<p><a id="release-notice-details" href="notices.html#v0-3-43">詳しく見る</a></p>
</template>
