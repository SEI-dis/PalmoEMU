<template id="latest-update-notes" data-version="0.3.35">
<p class="update-note-version" translate="no">0.3.35</p>
<ul><li data-i18n="{&quot;en&quot;:&quot;Added conversion to the PokemonStart 0.50-series save format and updated the converter to version 0.50.1, including its fix for Adventure Book 2 being unavailable immediately after conversion.&quot;,&quot;zh-Hans&quot;:&quot;新增对 PokemonStart 0.50 系列存档格式的转换支持，并将转换工具更新至 0.50.1 版，修复了转换后无法立即选择“冒险之书2”的问题。&quot;,&quot;zh-Hant&quot;:&quot;新增對 PokemonStart 0.50 系列存檔格式的轉換支援，並將轉換工具更新至 0.50.1 版，修正了轉換後無法立即選擇「冒險之書2」的問題。&quot;,&quot;ko&quot;:&quot;PokemonStart 0.50 계열 세이브 형식으로의 변환을 지원하고 변환 도구를 0.50.1 버전으로 업데이트했습니다. 변환 직후 「모험의 서 2」를 선택할 수 없던 문제의 수정도 반영했습니다.&quot;,&quot;es&quot;:&quot;Se añadió la conversión al formato de partidas guardadas de la serie 0.50 de PokemonStart y se actualizó el conversor a la versión 0.50.1, con la corrección del problema que impedía seleccionar el Libro de aventuras 2 justo después de la conversión.&quot;,&quot;fr&quot;:&quot;Ajout de la conversion vers le format de sauvegarde des versions 0.50 de PokemonStart et mise à jour de l’outil vers la version 0.50.1, avec son correctif pour le Livre d’aventure 2 inaccessible juste après la conversion.&quot;,&quot;de&quot;:&quot;Die Konvertierung in das Spielstandformat der PokemonStart-Versionsreihe 0.50 wird jetzt unterstützt. Das Konvertierungstool wurde auf Version 0.50.1 aktualisiert, einschließlich der Korrektur für das direkt nach der Konvertierung nicht auswählbare Abenteuerbuch 2.&quot;,&quot;pt&quot;:&quot;Adicionamos a conversão para o formato de dados salvos da série 0.50 do PokemonStart e atualizamos o conversor para a versão 0.50.1, com a correção do problema que impedia selecionar o Livro de Aventuras 2 logo após a conversão.&quot;}">PokemonStartの0.50系セーブ形式への変換に対応し、変換ツールを0.50.1版へ更新しました。変換直後に「ぼうけんのしょ2」が選べなくなる問題への修正を取り込みました。</li><li data-i18n="{&quot;en&quot;:&quot;You can now choose which systems to save for offline use. App updates reuse identical files already downloaded to reduce download size.&quot;,&quot;zh-Hans&quot;:&quot;现在可以选择要保存以供离线使用的机种。应用更新会复用已下载的相同文件，减少下载量。&quot;,&quot;zh-Hant&quot;:&quot;現在可以選擇要儲存以供離線使用的機種。應用程式更新會重複利用已下載的相同檔案，減少下載量。&quot;,&quot;ko&quot;:&quot;오프라인에서 사용할 기종을 선택해 저장할 수 있습니다. 앱 업데이트 시 이미 다운로드한 동일한 파일을 재사용하여 다운로드 용량을 줄였습니다.&quot;,&quot;es&quot;:&quot;Ahora puedes elegir qué sistemas guardar para usarlos sin conexión. Las actualizaciones de la aplicación reutilizan los archivos idénticos ya descargados para reducir las descargas.&quot;,&quot;fr&quot;:&quot;Vous pouvez désormais choisir les consoles à enregistrer pour une utilisation hors ligne. Les mises à jour de l’application réutilisent les fichiers identiques déjà téléchargés pour réduire le volume des téléchargements.&quot;,&quot;de&quot;:&quot;Sie können jetzt auswählen, welche Systeme für die Offline-Nutzung gespeichert werden. App-Updates verwenden bereits heruntergeladene identische Dateien erneut und reduzieren so das Downloadvolumen.&quot;,&quot;pt&quot;:&quot;Agora você pode escolher quais sistemas salvar para uso offline. As atualizações do aplicativo reutilizam arquivos idênticos já baixados para reduzir o volume de download.&quot;}">オフラインで使う機種を選んで保存できるようになりました。アプリ更新では取得済みの同じファイルを再利用し、ダウンロード量を減らしました。</li><li data-i18n="{&quot;en&quot;:&quot;Made save and backup lists faster to open, and strengthened data checks and protection when restoring or deleting.&quot;,&quot;zh-Hans&quot;:&quot;加快了存档和备份列表的打开速度，并加强了恢复或删除时的数据检查与保护。&quot;,&quot;zh-Hant&quot;:&quot;加快了存檔與備份清單的開啟速度，並加強了還原或刪除時的資料檢查與保護。&quot;,&quot;ko&quot;:&quot;세이브와 백업 목록을 여는 속도를 개선하고, 복원하거나 삭제할 때 데이터 검사와 보호를 강화했습니다.&quot;,&quot;es&quot;:&quot;Se agilizó la apertura de las listas de partidas guardadas y copias de seguridad, y se reforzaron la comprobación y protección de los datos al restaurar o eliminar.&quot;,&quot;fr&quot;:&quot;L’ouverture des listes de sauvegardes et de copies de sauvegarde est plus rapide. Les vérifications et la protection des données ont été renforcées lors de la restauration ou de la suppression.&quot;,&quot;de&quot;:&quot;Spielstand- und Sicherungslisten öffnen sich schneller. Die Datenprüfung und der Schutz beim Wiederherstellen oder Löschen wurden verbessert.&quot;,&quot;pt&quot;:&quot;Aceleramos a abertura das listas de dados salvos e backups e reforçamos a verificação e a proteção dos dados ao restaurar ou excluir.&quot;}">セーブやバックアップの一覧を開く処理を軽量化し、復元・削除時のデータ確認と保護を強化しました。</li></ul>
<p><a id="release-notice-details" href="notices.html#v0-3-35">詳しく見る</a></p>
</template>
