<template id="latest-update-notes" data-version="0.3.33">
<p class="update-note-version" translate="no">0.3.33</p>
<ul><li data-i18n="{&quot;en&quot;:&quot;Fixed an issue that incorrectly blocked supported save conversions and transfers when updating a ROM to PokemonStart 0.48.0.&quot;,&quot;zh-Hans&quot;:&quot;修复了将 ROM 更新到 PokemonStart 0.48.0 时，原本支持的存档转换或迁移被误判为不支持、导致无法继续的问题。&quot;,&quot;zh-Hant&quot;:&quot;修正了將 ROM 更新至 PokemonStart 0.48.0 時，原本支援的存檔轉換或移轉被誤判為不支援，導致無法繼續的問題。&quot;,&quot;ko&quot;:&quot;PokemonStart 0.48.0으로 ROM을 업데이트할 때 지원되는 세이브 변환이나 이전이 지원되지 않는 것으로 잘못 표시되어 진행할 수 없던 문제를 수정했습니다.&quot;,&quot;es&quot;:&quot;Se corrigió un error que impedía convertir o transferir partidas guardadas compatibles a PokemonStart 0.48.0 al marcarlas incorrectamente como no admitidas durante la actualización de la ROM.&quot;,&quot;fr&quot;:&quot;Correction d’un problème qui empêchait de convertir ou de transférer des sauvegardes vers PokemonStart 0.48.0 en indiquant à tort que ces opérations n’étaient pas prises en charge.&quot;,&quot;de&quot;:&quot;Ein Fehler wurde behoben, durch den unterstützte Spielstandkonvertierungen oder -übertragungen beim ROM-Update auf PokemonStart 0.48.0 fälschlich als nicht unterstützt angezeigt und blockiert wurden.&quot;,&quot;pt&quot;:&quot;Corrigimos um problema que bloqueava a conversão ou transferência de dados salvos para PokemonStart 0.48.0, indicando incorretamente que essas operações não tinham suporte.&quot;}">PokemonStart 0.48.0へのROM更新で、対応しているセーブの変換・引き継ぎが「未対応」と表示されて進めない問題を修正しました。</li></ul>
<p><a id="release-notice-details" href="notices.html#v0-3-33">詳しく見る</a></p>
</template>
<!-- latest-update-notes:end -->
