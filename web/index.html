<template id="latest-update-notes" data-version="0.3.34">
<p class="update-note-version" translate="no">0.3.34</p>
<ul><li data-i18n="{&quot;en&quot;:&quot;Updated the PokemonStart save converter to the 0.49.0-compatible release.&quot;,&quot;zh-Hans&quot;:&quot;已将 PokemonStart 存档转换工具更新至支持 0.49.0 的版本。&quot;,&quot;zh-Hant&quot;:&quot;已將 PokemonStart 存檔轉換工具更新至支援 0.49.0 的版本。&quot;,&quot;ko&quot;:&quot;PokemonStart 세이브 변환 도구를 0.49.0을 지원하는 버전으로 업데이트했습니다.&quot;,&quot;es&quot;:&quot;Se actualizó el conversor de partidas guardadas de PokemonStart a la versión compatible con 0.49.0.&quot;,&quot;fr&quot;:&quot;L’outil de conversion des sauvegardes PokemonStart a été mis à jour vers la version compatible avec 0.49.0.&quot;,&quot;de&quot;:&quot;Das PokemonStart-Tool zur Spielstandkonvertierung wurde auf die mit 0.49.0 kompatible Version aktualisiert.&quot;,&quot;pt&quot;:&quot;A ferramenta de conversão de dados salvos do PokemonStart foi atualizada para a versão compatível com 0.49.0.&quot;}">PokemonStartのセーブ変換ツールを0.49.0対応版へ更新しました。</li><li data-i18n="{&quot;en&quot;:&quot;Fixed an issue where mute and volume settings were not applied correctly immediately after starting a game.&quot;,&quot;zh-Hans&quot;:&quot;修复了游戏刚启动时静音和音量设置未正确生效的问题。&quot;,&quot;zh-Hant&quot;:&quot;修正了遊戲剛啟動時靜音與音量設定未正確生效的問題。&quot;,&quot;ko&quot;:&quot;게임 실행 직후 음소거와 볼륨 설정이 제대로 적용되지 않던 문제를 수정했습니다.&quot;,&quot;es&quot;:&quot;Se corrigió un error que impedía aplicar correctamente los ajustes de silencio y volumen al iniciar un juego.&quot;,&quot;fr&quot;:&quot;Correction d’un problème empêchant l’application correcte des réglages de mise en sourdine et de volume au démarrage d’un jeu.&quot;,&quot;de&quot;:&quot;Ein Fehler wurde behoben, durch den die Einstellungen für Stummschaltung und Lautstärke direkt nach dem Spielstart nicht korrekt angewendet wurden.&quot;,&quot;pt&quot;:&quot;Corrigimos um problema que impedia a aplicação correta das configurações de mudo e volume logo após iniciar um jogo.&quot;}">ゲーム起動直後にミュートや音量が正しく反映されない問題を修正しました。</li><li data-i18n="{&quot;en&quot;:&quot;Strengthened protection for existing save data when loading a save during gameplay fails.&quot;,&quot;zh-Hans&quot;:&quot;加强了游戏过程中读取存档失败时对原有存档数据的保护。&quot;,&quot;zh-Hant&quot;:&quot;加強了遊戲過程中讀取存檔失敗時對原有存檔資料的保護。&quot;,&quot;ko&quot;:&quot;플레이 중 세이브 불러오기에 실패했을 때 기존 저장 데이터를 보호하는 처리를 강화했습니다.&quot;,&quot;es&quot;:&quot;Se reforzó la protección de los datos guardados existentes cuando falla la carga de una partida durante el juego.&quot;,&quot;fr&quot;:&quot;La protection des sauvegardes existantes a été renforcée en cas d’échec du chargement d’une sauvegarde pendant le jeu.&quot;,&quot;de&quot;:&quot;Der Schutz vorhandener Spielstände wurde verbessert, falls das Laden eines Spielstands während des Spielens fehlschlägt.&quot;,&quot;pt&quot;:&quot;Reforçamos a proteção dos dados salvos existentes quando ocorre uma falha ao carregar dados salvos durante o jogo.&quot;}">プレイ中のセーブ読み込みに失敗した場合に、元の保存データを保護する処理を強化しました。</li></ul>
<p><a id="release-notice-details" href="notices.html#v0-3-34">詳しく見る</a></p>
</template>
