<ul><li data-i18n="{&quot;en&quot;:&quot;Added “Update ROM” to Import. Select a game to copy its in-game save to a newer ROM. The old ROM and save are kept.&quot;,&quot;zh-Hans&quot;:&quot;在导入中增加了“更新ROM”。选择游戏，可以将存档转移到新版ROM。旧ROM和存档会保留。&quot;,&quot;zh-Hant&quot;:&quot;在匯入功能中新增了「更新 ROM」。您可以選擇遊戲，並將存檔轉移到新版 ROM。舊的 ROM 和存檔都會保留。&quot;,&quot;ko&quot;:&quot;가져오기에 ‘ROM 업데이트’를 추가했습니다. 게임을 선택해 새 버전 ROM으로 게임 내 세이브를 복사할 수 있습니다. 기존 ROM과 세이브는 유지됩니다.&quot;,&quot;es&quot;:&quot;Ahora puedes seleccionar «Actualizar ROM» en Importar y copiar la partida guardada a una nueva versión de la ROM. La ROM anterior y su partida se conservan.&quot;,&quot;fr&quot;:&quot;L’option « Mettre à jour la ROM » a été ajoutée à l’importation. Choisissez un jeu pour copier sa sauvegarde vers une nouvelle version de la ROM. L’ancienne ROM et sa sauvegarde sont conservées.&quot;,&quot;de&quot;:&quot;„ROM aktualisieren“ wurde zum Import hinzugefügt. Wählen Sie ein Spiel und übertragen Sie den Speicherstand auf die neue ROM. Die alte ROM und der Speicherstand bleiben erhalten.&quot;,&quot;pt&quot;:&quot;Adicionamos \&quot;Atualizar ROM\&quot; na importação. Selecione um jogo e transfira o save para a nova versão do ROM. O ROM antigo e o save serão mantidos.&quot;}">インポートに「ROMを更新」を追加しました。ゲームを選び、新版ROMへセーブを引き継げます。旧ROMとセーブは残ります。</li></ul>
<p><a id="release-notice-details" href="notices.html#v0-3-25">詳しく見る</a></p>
