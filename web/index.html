<template id="latest-update-notes" data-version="0.3.29">
<p class="update-note-version" translate="no">0.3.29</p>
<ul><li data-i18n="{&quot;en&quot;:&quot;You can now choose which games and data to back up. Large backups can be split into files, and your trainer card and play time can be transferred too.&quot;,&quot;zh-Hans&quot;:&quot;现在可以选择要备份的游戏和数据。大型备份支持拆分为多个文件，也支持转移训练家卡和游玩时间。&quot;,&quot;zh-Hant&quot;:&quot;現在可以選擇要備份的遊戲和資料。大型備份支援分割為多個檔案，也支援轉移訓練家卡和遊玩時間。&quot;,&quot;ko&quot;:&quot;백업할 게임과 데이터를 선택할 수 있습니다. 큰 백업을 여러 파일로 나누고, 트레이너 카드와 플레이 시간도 옮길 수 있습니다.&quot;,&quot;es&quot;:&quot;Ahora puedes elegir qué juegos y datos incluir en la copia de seguridad. Las copias grandes se pueden dividir en archivos y también permiten transferir la tarjeta de entrenador y el tiempo de juego.&quot;,&quot;fr&quot;:&quot;Vous pouvez désormais choisir les jeux et les données à sauvegarder. Les sauvegardes volumineuses peuvent être divisées en fichiers, et la carte de Dresseur ainsi que le temps de jeu peuvent aussi être transférés.&quot;,&quot;de&quot;:&quot;Spiele und Daten für Backups können jetzt ausgewählt werden. Große Backups lassen sich auf mehrere Dateien verteilen. Auch Trainerkarte und Spielzeit können übertragen werden.&quot;,&quot;pt&quot;:&quot;Agora você pode escolher os jogos e dados incluídos no backup. Backups grandes podem ser divididos em arquivos, e o cartão de treinador e o tempo de jogo também podem ser transferidos.&quot;}">バックアップでゲームや保存する内容を選べるようにしました。大きいデータの分割保存と、トレーナーカード・プレイ時間の引き継ぎにも対応します。</li><li data-i18n="{&quot;en&quot;:&quot;mGBA now saves in-game save data to your device sooner once writing has settled.&quot;,&quot;zh-Hans&quot;:&quot;mGBA 现在会在写入稳定后，更快地将游戏内存档保存到设备。&quot;,&quot;zh-Hant&quot;:&quot;mGBA 現在會在寫入穩定後，更快地將遊戲內存檔儲存到裝置。&quot;,&quot;ko&quot;:&quot;mGBA의 게임 내 세이브를 쓰기가 안정된 뒤 기기에 더 빨리 저장하도록 개선했습니다.&quot;,&quot;es&quot;:&quot;mGBA ahora guarda antes en el dispositivo las partidas guardadas dentro del juego, una vez estabilizada la escritura.&quot;,&quot;fr&quot;:&quot;mGBA enregistre désormais plus rapidement sur l’appareil les sauvegardes effectuées dans le jeu, une fois les écritures stabilisées.&quot;,&quot;de&quot;:&quot;mGBA sichert Spielstände aus dem Spiel jetzt früher auf dem Gerät, sobald die Schreibvorgänge zur Ruhe gekommen sind.&quot;,&quot;pt&quot;:&quot;O mGBA agora grava os saves feitos dentro do jogo no dispositivo mais cedo, assim que as gravações se estabilizam.&quot;}">mGBAのゲーム内セーブを、書き込みが落ち着いたあと早めに端末へ保存するようにしました。</li><li data-i18n="{&quot;en&quot;:&quot;Added an option to keep the screen on while playing, along with performance measurement for rendering, audio and saving.&quot;,&quot;zh-Hans&quot;:&quot;新增游玩时保持屏幕常亮的选项，以及画面绘制、音频供给和保存操作的性能测量。&quot;,&quot;zh-Hant&quot;:&quot;新增遊玩時保持螢幕開啟的選項，以及畫面繪製、音訊供給和儲存操作的效能量測。&quot;,&quot;ko&quot;:&quot;플레이 중 화면 켜짐 유지 옵션과 렌더링, 오디오 공급, 저장 작업의 성능 측정을 추가했습니다.&quot;,&quot;es&quot;:&quot;Se añadió una opción para mantener la pantalla encendida al jugar y medir el rendimiento del renderizado, el audio y el guardado.&quot;,&quot;fr&quot;:&quot;Ajout d’une option pour garder l’écran allumé pendant le jeu et mesurer les performances du rendu, de l’audio et de l’enregistrement.&quot;,&quot;de&quot;:&quot;Neu sind eine Option zum Verhindern des Bildschirmruhezustands beim Spielen und Leistungsmessungen für Grafik, Audio und Speicherung.&quot;,&quot;pt&quot;:&quot;Foram adicionadas uma opção para manter a tela ligada durante o jogo e medições de desempenho de renderização, áudio e salvamento.&quot;}">プレイ中の画面消灯防止と、描画・音声・保存の動作計測を追加しました。</li></ul>
<p><a id="release-notice-details" href="notices.html#v0-3-29">詳しく見る</a></p>
</template>
