<template id="latest-update-notes" data-version="0.3.41">
<p class="update-note-version" translate="no">0.3.41</p>
<ul><li data-i18n="{&quot;en&quot;:&quot;Updated save conversion to the tool supplied with PokemonStart 0.62.0, adding support for the 100-box save format (0.61.0 and later).&quot;,&quot;zh-Hans&quot;:&quot;已采用 PokemonStart 0.62.0 附带的工具更新存档转换功能，支持 100 个盒子的存档格式（0.61.0 及更高版本）。&quot;,&quot;zh-Hant&quot;:&quot;已採用 PokemonStart 0.62.0 隨附的工具更新存檔轉換功能，支援 100 個盒子的存檔格式（0.61.0 及更新版本）。&quot;,&quot;ko&quot;:&quot;PokemonStart 0.62.0에 포함된 도구로 세이브 변환 기능을 업데이트하여 박스 100개를 지원하는 저장 형식(0.61.0 이상)에 대응했습니다.&quot;,&quot;es&quot;:&quot;La conversión de partidas guardadas se ha actualizado con la herramienta incluida en PokemonStart 0.62.0 y ahora admite el formato de 100 cajas (0.61.0 y posteriores).&quot;,&quot;fr&quot;:&quot;La conversion utilise désormais l’outil fourni avec PokemonStart 0.62.0 et prend en charge le format de sauvegarde à 100 boîtes (0.61.0 et versions ultérieures).&quot;,&quot;de&quot;:&quot;Die Spielstand-Konvertierung wurde auf das mit PokemonStart 0.62.0 gelieferte Tool aktualisiert und unterstützt das Speicherformat mit 100 Boxen (ab 0.61.0).&quot;,&quot;pt&quot;:&quot;A conversão de dados salvos foi atualizada com a ferramenta incluída no PokemonStart 0.62.0 e agora aceita o formato de 100 caixas (0.61.0 e posteriores).&quot;}">セーブ変換をPokemonStart 0.62.0付属のツールに更新し、100箱の保存形式（0.61.0以降）に対応しました。</li><li data-i18n="{&quot;en&quot;:&quot;Conversion preserves data in boxes, egg boxes, your party and the Day Care. The original ROM and save are kept.&quot;,&quot;zh-Hans&quot;:&quot;转换时会保留盒子、蛋盒、同行队伍及寄放屋的数据。原始 ROM 和存档也会保留。&quot;,&quot;zh-Hant&quot;:&quot;轉換時會保留盒子、蛋盒、同行隊伍及寄放屋的資料。原始 ROM 與存檔也會保留。&quot;,&quot;ko&quot;:&quot;변환 시 박스, 알 박스, 파티, 맡기미집의 데이터를 유지합니다. 원본 ROM과 세이브는 보관됩니다.&quot;,&quot;es&quot;:&quot;La conversión conserva los datos de las cajas, las cajas de huevos, el equipo y la guardería. Se mantienen la ROM y la partida guardada originales.&quot;,&quot;fr&quot;:&quot;La conversion conserve les données des boîtes, des boîtes à œufs, de l’équipe et de la pension. La ROM et la sauvegarde d’origine sont conservées.&quot;,&quot;de&quot;:&quot;Bei der Konvertierung bleiben die Daten in Boxen, Eierboxen, Team und Pension erhalten. Die ursprüngliche ROM und der ursprüngliche Spielstand werden aufbewahrt.&quot;,&quot;pt&quot;:&quot;A conversão preserva os dados das caixas, das caixas de ovos, da equipe e do berçário. A ROM e os dados salvos originais são mantidos.&quot;}">変換時はボックス・卵ボックス・手持ち・預かり屋のデータを保持します。元のROMとセーブは残します。</li></ul>
<p><a id="release-notice-details" href="notices.html#v0-3-41">詳しく見る</a></p>
</template>
