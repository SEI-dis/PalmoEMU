<template id="latest-update-notes" data-version="0.3.30">
<p class="update-note-version" translate="no">0.3.30</p>
<ul><li data-i18n="{&quot;en&quot;:&quot;Improved performance during map transitions and other effects.&quot;,&quot;zh-Hans&quot;:&quot;改善了地图切换等特效期间的运行表现。&quot;,&quot;zh-Hant&quot;:&quot;改善了地圖切換等特效期間的執行表現。&quot;,&quot;ko&quot;:&quot;맵 전환 등 효과 표시 중 성능을 개선했습니다.&quot;,&quot;es&quot;:&quot;Se mejoró el rendimiento durante las transiciones de mapa y otros efectos.&quot;,&quot;fr&quot;:&quot;Amélioration des performances lors des transitions de carte et des autres effets.&quot;,&quot;de&quot;:&quot;Die Leistung bei Kartenwechseln und anderen Effekten wurde verbessert.&quot;,&quot;pt&quot;:&quot;Melhorámos o desempenho durante transições de mapa e outros efeitos.&quot;}">マップ切り替えなどの演出中の動作を改善しました。</li><li data-i18n="{&quot;en&quot;:&quot;Reduced memory use when loading large ROMs and improved cleanup after exit.&quot;,&quot;zh-Hans&quot;:&quot;减少了加载大型 ROM 时的内存用量，并改善了退出后的清理。&quot;,&quot;zh-Hant&quot;:&quot;減少了載入大型 ROM 時的記憶體用量，並改善了結束後的清理。&quot;,&quot;ko&quot;:&quot;대용량 ROM을 불러올 때 메모리 사용량을 줄이고 종료 후 정리를 개선했습니다.&quot;,&quot;es&quot;:&quot;Se redujo el uso de memoria al cargar ROM grandes y se mejoró la limpieza al salir.&quot;,&quot;fr&quot;:&quot;Réduction de la mémoire utilisée pour charger les grandes ROM et amélioration du nettoyage à la fermeture.&quot;,&quot;de&quot;:&quot;Der Speicherverbrauch beim Laden großer ROMs wurde reduziert und die Freigabe nach dem Beenden verbessert.&quot;,&quot;pt&quot;:&quot;Reduzimos a utilização de memória ao carregar ROMs grandes e melhorámos a limpeza ao sair.&quot;}">大きなROMの起動時に使うメモリを削減し、終了時の解放処理を改善しました。</li><li data-i18n="{&quot;en&quot;:&quot;Improved recovery when audio is unavailable at game startup.&quot;,&quot;zh-Hans&quot;:&quot;改善了游戏启动时无声的恢复操作。&quot;,&quot;zh-Hant&quot;:&quot;改善了遊戲啟動時無聲的恢復操作。&quot;,&quot;ko&quot;:&quot;게임 시작 시 소리가 나지 않는 경우의 복구 조작을 개선했습니다.&quot;,&quot;es&quot;:&quot;Se mejoró la recuperación cuando no hay sonido al iniciar un juego.&quot;,&quot;fr&quot;:&quot;Amélioration de la récupération lorsque le son est indisponible au démarrage du jeu.&quot;,&quot;de&quot;:&quot;Die Wiederherstellung der Tonausgabe beim Spielstart wurde verbessert.&quot;,&quot;pt&quot;:&quot;Melhorámos a recuperação quando não há som ao iniciar um jogo.&quot;}">ゲーム起動時に音が出ない場合の復帰操作を改善しました。</li></ul>
<p><a id="release-notice-details" href="notices.html#v0-3-30">詳しく見る</a></p>
</template>
<!-- latest-update-notes:end -->
