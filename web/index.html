<template id="latest-update-notes" data-version="0.3.32">
<p class="update-note-version" translate="no">0.3.32</p>
<ul><li data-i18n="{&quot;en&quot;:&quot;Improved audio startup and added retry on a normal tap when game audio does not start.&quot;,&quot;zh-Hans&quot;:&quot;改进了游戏启动时的音频初始化；没有声音时，可通过普通点击操作重试。&quot;,&quot;zh-Hant&quot;:&quot;改善了遊戲啟動時的音訊初始化；沒有聲音時，可透過一般點按操作重試。&quot;,&quot;ko&quot;:&quot;게임 시작 시 오디오 초기화를 개선하고, 소리가 나지 않을 때 일반적인 탭 조작으로 다시 시도할 수 있도록 했습니다.&quot;,&quot;es&quot;:&quot;Se mejoró el inicio del audio y se añadió un reintento al tocar la pantalla cuando el juego no tiene sonido.&quot;,&quot;fr&quot;:&quot;Amélioration du démarrage audio et ajout d’une nouvelle tentative lors d’un appui normal si le son du jeu ne démarre pas.&quot;,&quot;de&quot;:&quot;Der Audiostart wurde verbessert. Wenn der Spielton nicht startet, wird er bei normalem Antippen erneut versucht.&quot;,&quot;pt&quot;:&quot;Melhoramos a inicialização do áudio e adicionamos uma nova tentativa ao tocar normalmente na tela quando o jogo fica sem som.&quot;}">ゲーム起動時の音声開始処理を改善し、音が出ない場合に通常のタップ操作で再試行できるようにしました。</li><li data-i18n="{&quot;en&quot;:&quot;Updated the PokemonStart save converter to the 0.48.0-compatible release and fixed checks for new moves and held items, along with save transfer handling.&quot;,&quot;zh-Hans&quot;:&quot;将PokemonStart存档转换工具更新至支持0.48.0的版本，并修复了新招式、携带道具的检查及存档转移处理。&quot;,&quot;zh-Hant&quot;:&quot;將PokemonStart存檔轉換工具更新至支援0.48.0的版本，並修正了新招式、攜帶道具的檢查及存檔轉移處理。&quot;,&quot;ko&quot;:&quot;PokemonStart 세이브 변환 도구를 0.48.0 대응 버전으로 업데이트하고, 새로운 기술·지닌 도구의 검사와 세이브 이전 처리를 수정했습니다.&quot;,&quot;es&quot;:&quot;Se actualizó el conversor de partidas de PokemonStart a la versión compatible con 0.48.0 y se corrigieron las comprobaciones de movimientos y objetos equipados nuevos, así como la transferencia de partidas.&quot;,&quot;fr&quot;:&quot;Mise à jour du convertisseur de sauvegardes PokemonStart vers la version compatible avec 0.48.0, et correction des contrôles des nouvelles capacités et des objets tenus, ainsi que du transfert des sauvegardes.&quot;,&quot;de&quot;:&quot;Der PokemonStart-Spielstandkonverter wurde auf die mit 0.48.0 kompatible Version aktualisiert. Die Prüfung neuer Attacken und getragener Items sowie die Spielstandübertragung wurden korrigiert.&quot;,&quot;pt&quot;:&quot;Atualizamos o conversor de saves do PokemonStart para a versão compatível com 0.48.0 e corrigimos as verificações de novos golpes e itens equipados, além do processo de transferência de saves.&quot;}">PokemonStartのセーブ変換ツールを0.48.0対応版へ更新し、新しい技・持ち物の検査と引き継ぎ処理を修正しました。</li><li data-i18n="{&quot;en&quot;:&quot;Added PokemonStart update notifications and improved save compatibility checks for newer ROMs.&quot;,&quot;zh-Hans&quot;:&quot;新增了PokemonStart更新通知，并改进了新版ROM的存档兼容性检查。&quot;,&quot;zh-Hant&quot;:&quot;新增了PokemonStart更新通知，並改善了新版ROM的存檔相容性檢查。&quot;,&quot;ko&quot;:&quot;PokemonStart 업데이트 알림을 추가하고 새 ROM의 세이브 호환성 검사를 개선했습니다.&quot;,&quot;es&quot;:&quot;Se añadieron avisos de actualización de PokemonStart y se mejoraron las comprobaciones de compatibilidad de las partidas guardadas con ROM más recientes.&quot;,&quot;fr&quot;:&quot;Ajout de notifications de mise à jour de PokemonStart et amélioration des contrôles de compatibilité des sauvegardes avec les ROM plus récentes.&quot;,&quot;de&quot;:&quot;Update-Hinweise für PokemonStart wurden hinzugefügt und die Prüfung der Spielstandkompatibilität mit neueren ROMs wurde verbessert.&quot;,&quot;pt&quot;:&quot;Adicionamos avisos de atualização do PokemonStart e melhoramos a verificação de compatibilidade dos saves com ROMs mais recentes.&quot;}">PokemonStartの更新通知を追加し、新しいROMのセーブ互換性判定を改善しました。</li></ul>
<p><a id="release-notice-details" href="notices.html#v0-3-32">詳しく見る</a></p>
</template>
