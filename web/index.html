<template id="latest-update-notes" data-version="0.3.27">
<p class="update-note-version" translate="no">0.3.27</p>
<ul><li data-i18n="{&quot;en&quot;:&quot;On iPhone and iPad, videos now use the system save and share sheet so you can choose a destination without leaving the game page.&quot;,&quot;zh-Hans&quot;:&quot;iPhone和iPad现在通过系统保存与分享面板保存视频，无需离开游戏页面即可选择保存位置。&quot;,&quot;zh-Hant&quot;:&quot;iPhone和iPad現在透過系統儲存與分享面板儲存影片，無須離開遊戲頁面即可選擇儲存位置。&quot;,&quot;ko&quot;:&quot;iPhone과 iPad에서 시스템 저장·공유 시트로 동영상을 저장하도록 변경했습니다. 게임 페이지를 떠나지 않고 저장 위치를 선택할 수 있습니다.&quot;,&quot;es&quot;:&quot;En iPhone y iPad, los vídeos se guardan mediante el panel de guardado y uso compartido del sistema, sin abandonar la página del juego.&quot;,&quot;fr&quot;:&quot;Sur iPhone et iPad, les vidéos sont enregistrées via la feuille système d’enregistrement et de partage, sans quitter la page du jeu.&quot;,&quot;de&quot;:&quot;Auf iPhone und iPad werden Videos über den systemeigenen Dialog zum Speichern und Teilen gespeichert, ohne die Spielseite zu verlassen.&quot;,&quot;pt&quot;:&quot;No iPhone e no iPad, os vídeos agora são salvos pela folha de salvamento e compartilhamento do sistema, sem sair da página do jogo.&quot;}">iPhone・iPadの動画保存を標準の保存・共有シートへ切り替え、ゲーム画面を離れずに保存先を選べるようにしました。</li><li data-i18n="{&quot;en&quot;:&quot;Returning from a save screen no longer reloads the app while a game, recording, or save operation is still active or retained in memory.&quot;,&quot;zh-Hans&quot;:&quot;从保存界面等返回时，只要游戏、录制视频或保存操作仍在进行或保留，应用就不会重新加载。&quot;,&quot;zh-Hant&quot;:&quot;從儲存畫面等返回時，只要遊戲、錄製影片或儲存作業仍在進行或保留，應用程式就不會重新載入。&quot;,&quot;ko&quot;:&quot;저장 화면 등에서 돌아올 때 게임, 녹화 영상 또는 저장 작업이 남아 있으면 앱을 새로고침하지 않도록 했습니다.&quot;,&quot;es&quot;:&quot;Al volver de una pantalla de guardado, la aplicación ya no se recarga mientras haya un juego, una grabación o una operación de guardado pendientes.&quot;,&quot;fr&quot;:&quot;Au retour d’un écran d’enregistrement, l’application ne se recharge plus tant qu’un jeu, une vidéo enregistrée ou une opération d’enregistrement restent en cours ou en mémoire.&quot;,&quot;de&quot;:&quot;Bei der Rückkehr aus einem Speicherdialog wird die App nicht mehr neu geladen, solange ein Spiel, eine Aufnahme oder ein Speichervorgang noch aktiv oder im Speicher ist.&quot;,&quot;pt&quot;:&quot;Ao voltar de uma tela de salvamento, o aplicativo não recarrega enquanto houver um jogo, uma gravação ou uma operação de salvamento em andamento ou mantidos na memória.&quot;}">保存画面などから戻った際、ゲームや録画・保存処理が残っている間はアプリを再読み込みしないようにしました。</li></ul>
<p><a id="release-notice-details" href="notices.html#v0-3-27">詳しく見る</a></p>
</template>
<!-- latest-update-notes:end -->
