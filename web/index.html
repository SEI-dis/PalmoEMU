<template id="latest-update-notes" data-version="0.3.36">
<p class="update-note-version" translate="no">0.3.36</p>
<ul><li data-i18n="{&quot;en&quot;:&quot;Added conversion to the PokemonStart 0.53-series save format. The source and destination formats are checked to select the required conversion.&quot;,&quot;zh-Hans&quot;:&quot;新增对 PokemonStart 0.53 系列存档格式的转换支持。会检查原存档与目标版本的格式，选择所需的转换。&quot;,&quot;zh-Hant&quot;:&quot;新增對 PokemonStart 0.53 系列存檔格式的轉換支援。會檢查原存檔與目標版本的格式，選擇所需的轉換。&quot;,&quot;ko&quot;:&quot;PokemonStart 0.53 계열 세이브 형식으로의 변환을 지원합니다. 원본과 업데이트 대상의 형식을 확인하여 필요한 변환을 선택합니다.&quot;,&quot;es&quot;:&quot;Se añadió la conversión al formato de partidas guardadas de la serie 0.53 de PokemonStart. Se comprueban los formatos de origen y destino para seleccionar la conversión necesaria.&quot;,&quot;fr&quot;:&quot;Ajout de la conversion vers le format de sauvegarde des versions 0.53 de PokemonStart. Les formats source et cible sont vérifiés pour choisir la conversion nécessaire.&quot;,&quot;de&quot;:&quot;Die Konvertierung in das Spielstandformat der PokemonStart-Versionsreihe 0.53 wird jetzt unterstützt. Quell- und Zielformat werden geprüft, um die nötige Konvertierung auszuwählen.&quot;,&quot;pt&quot;:&quot;Adicionamos a conversão para o formato de dados salvos da série 0.53 do PokemonStart. Os formatos de origem e destino são verificados para selecionar a conversão necessária.&quot;}">PokemonStartの0.53系セーブ形式への変換に対応しました。変換元と更新先の形式を確認し、必要な変換を選びます。</li><li data-i18n="{&quot;en&quot;:&quot;Fixed a disabled preparation button remaining visible after offline preparation was complete.&quot;,&quot;zh-Hans&quot;:&quot;修复了离线准备完成后，已禁用的准备按钮仍然显示的问题。&quot;,&quot;zh-Hant&quot;:&quot;修正了離線準備完成後，已停用的準備按鈕仍然顯示的問題。&quot;,&quot;ko&quot;:&quot;오프라인 준비가 완료된 후에도 비활성화된 준비 버튼이 남아 있던 문제를 수정했습니다.&quot;,&quot;es&quot;:&quot;Se corrigió un problema que dejaba visible el botón de preparación desactivado tras completar la preparación para jugar sin conexión.&quot;,&quot;fr&quot;:&quot;Correction du bouton de préparation qui restait visible et désactivé une fois la préparation hors ligne terminée.&quot;,&quot;de&quot;:&quot;Ein Fehler wurde behoben, durch den nach abgeschlossener Offline-Vorbereitung weiterhin eine deaktivierte Vorbereitungsschaltfläche angezeigt wurde.&quot;,&quot;pt&quot;:&quot;Corrigimos um problema que mantinha o botão de preparação desativado visível após concluir a preparação para jogar offline.&quot;}">オフラインの準備が完了しているとき、無効な準備ボタンが残る問題を修正しました。</li><li data-i18n="{&quot;en&quot;:&quot;Updated the PokemonStart developer and contributor credits.&quot;,&quot;zh-Hans&quot;:&quot;更新了 PokemonStart 开发者与贡献者名单。&quot;,&quot;zh-Hant&quot;:&quot;更新了 PokemonStart 開發者與貢獻者名單。&quot;,&quot;ko&quot;:&quot;PokemonStart 개발자 및 기여자 크레딧을 업데이트했습니다.&quot;,&quot;es&quot;:&quot;Se actualizaron los créditos de los desarrolladores y colaboradores de PokemonStart.&quot;,&quot;fr&quot;:&quot;Mise à jour des crédits des développeurs et contributeurs de PokemonStart.&quot;,&quot;de&quot;:&quot;Die Angaben zu den Entwicklern und Mitwirkenden von PokemonStart wurden aktualisiert.&quot;,&quot;pt&quot;:&quot;Atualizamos os créditos dos desenvolvedores e colaboradores do PokemonStart.&quot;}">PokemonStartの開発・協力クレジットを更新しました。</li></ul>
<p><a id="release-notice-details" href="notices.html#v0-3-36">詳しく見る</a></p>
</template>
