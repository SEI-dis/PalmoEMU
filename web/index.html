<!doctype html>
<html lang="ja" data-theme="dark"><head><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src 'self' blob: wss://celio-server.up.railway.app/socket.io/; script-src 'self' blob: 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob:; worker-src 'self' blob:; frame-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'"><meta name="referrer" content="no-referrer"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#121212"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="app-version" content="0.3.16"><meta name="app-build" content="74579f486fe89d2a"><title>PalmoEMU — ManicEMUの非公式Web版</title><link rel="manifest" href="manifest.webmanifest"><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="native-menu.css"><link rel="stylesheet" href="link-panel.css"><link rel="stylesheet" href="controls.css"><link rel="stylesheet" href="import-progress.css"><link rel="stylesheet" href="diagnostics.css"><link rel="stylesheet" href="game-preferences.css"><link rel="stylesheet" href="input-controls.css"><link rel="stylesheet" href="covers.css"><link rel="stylesheet" href="library.css"><link rel="stylesheet" href="nds-skin.css"><link rel="stylesheet" href="skin-controls.css"><link rel="stylesheet" href="control-editor.css"><link rel="icon" href="assets/icon.svg" type="image/svg+xml"><link rel="apple-touch-icon" sizes="180x180" href="assets/apple-touch-icon-20d62b6bccd7.png"><meta name="apple-mobile-web-app-title" content="PalmoEMU"></head>
<body><div id="app">
  <header class="navigation"><button id="controllers" class="circle" aria-label="コントローラー"></button><span class="app-wordmark">PalmoEMU</span><button id="history" class="circle" aria-label="プレイ履歴"></button></header>
  <main id="content"></main>
  <nav class="tabbar" aria-label="メインメニュー"><button data-tab="games" class="active" aria-label="ゲーム"></button><button data-tab="imports" aria-label="インポート"></button><button data-tab="settings" aria-label="設定"></button></nav>
</div>
<section id="player" hidden aria-label="ゲーム画面"><div id="skin"><div id="screen"></div><div id="touch-controls"></div></div><button class="player-menu circle" id="player-menu" aria-label="ゲームメニュー"></button><div id="quick-actions" hidden><button id="quick-load" aria-label="load（クイック読込）" title="最新の手動保存を読み込む">load</button><button id="quick-save" aria-label="save（クイック保存）" title="現在の状態を新しく保存">save</button></div><output id="save-status" class="save-status" hidden></output><output id="fps-meter" class="fps-meter" hidden>計測中…</output><button id="boost" class="boost" aria-label="速度 1倍。押すと2倍" title="速度切替（1〜5倍） / Tab"><span aria-hidden="true">1×</span></button><button id="player-link" class="player-link" aria-label="GBA通信" title="GBA通信" aria-expanded="false" aria-controls="link-panel" hidden></button><section id="link-panel" class="link-panel" role="dialog" aria-modal="false" aria-label="通信（Beta）" hidden><header class="link-panel-head"><button id="link-panel-drag" class="link-panel-drag" aria-label="通信パネルを移動（ドラッグまたは矢印キー）"><span id="link-panel-icon" aria-hidden="true"></span><span class="link-panel-beta">Beta</span></button><button id="link-panel-close" class="link-panel-close" aria-label="通信パネルを閉じる（通信は継続）"></button></header><div id="link-panel-body" class="link-panel-body"></div></section><button id="resume-game" class="resume-game" hidden><span>一時停止中</span><strong>タップして再開</strong></button><div id="loading" role="status" hidden>コアを読み込んでいます…</div></section>
<dialog id="sheet" aria-labelledby="sheet-title"><div class="sheet-handle"></div><div class="sheet-head"><h2 id="sheet-title"></h2><div id="sheet-tools" class="sheet-tools"></div><img id="sheet-cover" alt="" hidden><button class="circle" id="close-sheet" aria-label="閉じる"></button></div><div id="sheet-body"></div></dialog>
<div id="toast" role="status" aria-live="polite"></div>
<!-- iOS file providers can disable unknown extensions when accept is set.
     Validate game, skin and save formats locally after selection instead. -->
<input id="rom-input" type="file" multiple hidden>
<input id="skin-input" type="file" hidden><input id="save-input" type="file" hidden><input id="cover-input" type="file" hidden accept="image/png,image/jpeg,image/webp">
<script src="dev-capabilities.js"></script><script src="cores/mgba/mgba.js"></script><script type="module" src="src/diagnostics.js"></script><script type="module" src="src/app.js"></script>
</body></html>
