<template id="latest-update-notes" data-version="0.3.25">
<p class="update-note-version" translate="no">0.3.25</p>
<ul><li data-i18n="{&quot;en&quot;:&quot;Added Update ROM to Import. Select a game to copy its in-game save to a new ROM version. The old ROM and save are kept.&quot;,&quot;zh-Hans&quot;:&quot;导入中新增了“更新ROM”。选择游戏即可将游戏存档复制到新版ROM，旧ROM和存档会保留。&quot;,&quot;zh-Hant&quot;:&quot;匯入中新增了「更新 ROM」。選擇遊戲即可將遊戲存檔複製到新版 ROM，舊 ROM 和存檔會保留。&quot;,&quot;ko&quot;:&quot;가져오기에 ‘ROM 업데이트’를 추가했습니다. 게임을 선택해 새 버전 ROM으로 게임 내 세이브를 복사할 수 있습니다. 기존 ROM과 세이브는 유지됩니다.&quot;,&quot;es&quot;:&quot;Se añadió «Actualizar ROM» a Importar. Elige un juego para copiar su partida guardada a una nueva versión de la ROM. La ROM anterior y su partida se conservan.&quot;,&quot;fr&quot;:&quot;L’option « Mettre à jour la ROM » a été ajoutée à l’importation. Choisissez un jeu pour copier sa sauvegarde vers une nouvelle version de la ROM. L’ancienne ROM et sa sauvegarde sont conservées.&quot;,&quot;de&quot;:&quot;Unter Importieren gibt es jetzt „ROM aktualisieren“. Wählen Sie ein Spiel, um den Spielstand in eine neue ROM-Version zu kopieren. Die alte ROM und ihr Spielstand bleiben erhalten.&quot;,&quot;pt&quot;:&quot;A opção “Atualizar ROM” foi adicionada à importação. Escolha um jogo para copiar seu save para uma nova versão da ROM. A ROM antiga e seu save são mantidos.&quot;}">インポートに「ROMを更新」を追加しました。ゲームを選び、新版ROMへセーブを引き継げます。旧ROMとセーブは残ります。</li><li data-i18n="{&quot;en&quot;:&quot;Added a Trainer Card in Settings with an editable nickname, combined playtime across ROM updates and your most played games.&quot;,&quot;zh-Hans&quot;:&quot;设置中新增了训练家卡，可修改昵称，并查看ROM更新前后累计的游玩时间和常玩的游戏。&quot;,&quot;zh-Hant&quot;:&quot;設定中新增了訓練家卡，可修改暱稱，並查看 ROM 更新前後累計的遊玩時間與常玩的遊戲。&quot;,&quot;ko&quot;:&quot;설정에 트레이너 카드를 추가했습니다. 닉네임을 변경하고, ROM 업데이트 전후를 합산한 플레이 시간과 자주 하는 게임을 볼 수 있습니다.&quot;,&quot;es&quot;:&quot;Se añadió una tarjeta de entrenador a Ajustes, con un apodo editable, el tiempo de juego acumulado entre versiones de la ROM y los juegos más jugados.&quot;,&quot;fr&quot;:&quot;Une Carte de Dresseur a été ajoutée aux paramètres : pseudonyme modifiable, temps de jeu cumulé entre les versions d’une ROM et jeux les plus joués.&quot;,&quot;de&quot;:&quot;Die Einstellungen enthalten jetzt eine Trainerkarte mit bearbeitbarem Spitznamen, zusammengezählter Spielzeit über ROM-Versionen hinweg und den meistgespielten Spielen.&quot;,&quot;pt&quot;:&quot;Um Cartão de Treinador foi adicionado às configurações, com apelido editável, tempo de jogo somado entre versões da ROM e os jogos mais jogados.&quot;}">設定にトレーナーカードを追加しました。ニックネームを変更でき、ROMの更新前後をまとめたプレイ時間と、よく遊ぶゲームを表示します。</li><li data-i18n="{&quot;en&quot;:&quot;Added Quick Start. Enable it to start playing when you tap a game. It is off by default.&quot;,&quot;zh-Hans&quot;:&quot;新增了快速启动。开启后，点击游戏即可直接游玩。默认关闭。&quot;,&quot;zh-Hant&quot;:&quot;新增了快速啟動。開啟後，點擊遊戲即可直接遊玩。預設關閉。&quot;,&quot;ko&quot;:&quot;빠른 시작을 추가했습니다. 켜면 게임을 탭하여 바로 플레이할 수 있습니다. 기본값은 꺼짐입니다.&quot;,&quot;es&quot;:&quot;Se añadió Inicio rápido. Al activarlo, basta con tocar un juego para jugar. Está desactivado por defecto.&quot;,&quot;fr&quot;:&quot;Le démarrage rapide permet de lancer un jeu en le touchant. Il est désactivé par défaut.&quot;,&quot;de&quot;:&quot;Schnellstart wurde hinzugefügt. Ist er aktiviert, startet ein Spiel durch Antippen. Standardmäßig ist er ausgeschaltet.&quot;,&quot;pt&quot;:&quot;O Início Rápido foi adicionado. Ative-o para começar a jogar ao tocar em um jogo. Ele vem desativado.&quot;}">クイックスタートを追加しました。オンにすると、ゲームをタップしてすぐに遊べます。初期設定はオフです。</li></ul>
<p><a id="release-notice-details" href="notices.html#v0-3-25">詳しく見る</a></p>
</template>
